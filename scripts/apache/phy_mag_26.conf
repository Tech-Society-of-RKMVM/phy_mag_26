<VirtualHost *:8080>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/phy_mag_26

    <Directory /var/www/phy_mag_26>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/phy_mag_26_error.log
    CustomLog ${APACHE_LOG_DIR}/phy_mag_26_access.log combined
</VirtualHost>
