<VirtualHost *:80>
    ServerAdmin admin@localhost
    ServerName physics.magazine.rkmvmfamily.in

    DocumentRoot /var/www/phy_mag_26

    <Directory /var/www/phy_mag_26>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/physics_magazine_error.log
    CustomLog ${APACHE_LOG_DIR}/physics_magazine_access.log combined
</VirtualHost>
